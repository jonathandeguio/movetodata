user  nginx;
worker_processes  1;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include            /etc/nginx/mime.types;
    default_type       application/octet-stream;

    # -------------------------------------------------------------------------
    # Couche Audit — Format de log JSON (timestamp, IP, méthode, path, status,
    # response_time). Compatible nginx >= 1.11.8 (escape=json).
    # -------------------------------------------------------------------------
    log_format json_main escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"path":"$uri",'
            '"query":"$args",'
            '"status":$status,'
            '"response_time":$request_time,'
            '"bytes_sent":$body_bytes_sent,'
            '"referer":"$http_referer",'
            '"user_agent":"$http_user_agent",'
            '"x_forwarded_for":"$http_x_forwarded_for"'
        '}';

    access_log  /var/log/nginx/access.log  json_main;

    sendfile           on;
    keepalive_timeout  65;
    client_max_body_size 500m;

    # -------------------------------------------------------------------------
    # Couche API — Rate Limiting
    # Zone "api"  : 30 req/min par IP (burst 10 sans délai)
    # Zone "auth" : 10 req/min par IP (burst 5 sans délai) pour /passport/
    # -------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api:10m  rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    # -------------------------------------------------------------------------
    # Couche API — WAF léger : bloquer SQLi et XSS dans l'URI complète
    # La variable $block_attack vaut 1 si un pattern suspect est détecté.
    # Portée : query string + path (via $request_uri).
    # -------------------------------------------------------------------------
    map $request_uri $block_sqli {
        default                                                          0;
        "~*(\bunion\b.{0,30}\bselect\b)"                                1;
        "~*(\bselect\b.{0,30}\bfrom\b)"                                 1;
        "~*(\bdrop\b.{0,20}\btable\b)"                                  1;
        "~*(\binsert\b.{0,20}\binto\b)"                                 1;
        "~*(\bdelete\b.{0,20}\bfrom\b)"                                 1;
        "~*(--|\/\*|\*\/|;\s*(drop|alter|create|truncate))"             1;
        "~*(xp_cmdshell|information_schema|pg_sleep)"                   1;
    }

    map $request_uri $block_xss {
        default                                               0;
        "~*(<script[^>]*>|<\/script>)"                        1;
        "~*(javascript\s*:)"                                  1;
        "~*(on(error|load|click|mouseover)\s*=)"              1;
        "~*(eval\s*\(|expression\s*\()"                       1;
        "~*(vbscript\s*:)"                                    1;
        "~*(<iframe|<object|<embed|<applet)"                  1;
    }

    server {
        listen       80;
        server_name  localhost;
        root   /app;

        # ---------------------------------------------------------------------
        # Couche API — Protection OWASP Top 10 : headers de sécurité HTTP
        # ---------------------------------------------------------------------
        add_header X-Frame-Options           "SAMEORIGIN"                            always;
        add_header X-Content-Type-Options    "nosniff"                               always;
        add_header X-XSS-Protection          "1; mode=block"                         always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"       always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'self';"
            always;
        # HSTS activé uniquement si TLS est terminé en amont (reverse-proxy TLS)
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Masquer la version nginx
        server_tokens off;

        # ---------------------------------------------------------------------
        # Couche API — WAF : rejeter les requêtes avec patterns SQLi / XSS
        # ---------------------------------------------------------------------
        if ($block_sqli) { return 403; }
        if ($block_xss)  { return 403; }

        # WebSocket (SockJS / STOMP) — pas de rate limiting sur le WS
        location /api/ws/ {
            proxy_pass http://boson:8080/api/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }

        location /api/ {
            limit_req zone=api burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://boson:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
            proxy_cookie_flags bAT nosecure samesite=lax;
            proxy_cookie_flags bRT nosecure samesite=lax;
        }

        location /passport/ {
            limit_req zone=auth burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://boson:8080/passport/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
            proxy_cookie_flags bAT nosecure samesite=lax;
            proxy_cookie_flags bRT nosecure samesite=lax;
        }

        location /endpoints/ {
            proxy_pass http://boson:8080/endpoints/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /saml2/ {
            proxy_pass http://boson:8080/saml2/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /learn/ {
            proxy_pass http://movetodata-docs:80/learn/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            index  index.html;
            try_files $uri $uri/ /index.html;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
